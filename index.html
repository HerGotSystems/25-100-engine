<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>25/100 — Learning Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0c;--surface:#141414;--surface2:#1c1c1c;--surface3:#242424;--border:#2a2a2a;--border2:#363636;--text:#e0e0e0;--muted:#666;--dim:#3a3a3a;--gold:#c8960a;--gold-lt:#e0aa10;--gold-dim:#1a1200;--cat1:#b87200;--cat1b:#180f00;--cat2:#1a55bb;--cat2b:#070e20;--cat3:#128550;--cat3b:#031508;--cat4:#a84000;--cat4b:#180800;--danger:#992020;--font:'Space Mono',monospace;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:12px;line-height:1.5;display:flex;flex-direction:column;}
header{background:var(--surface);border-bottom:1px solid var(--border);height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex-shrink:0;}
.logo{display:flex;align-items:baseline;gap:8px;}
.logo-mark{font-size:18px;font-weight:700;color:var(--gold);letter-spacing:-1px;}
.logo-div{color:var(--dim);}
.logo-tag{font-size:9px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;}
.header-nav{display:flex;gap:2px;}
.nav-btn{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:var(--font);font-size:9px;letter-spacing:2px;text-transform:uppercase;padding:5px 12px;cursor:pointer;transition:all .12s;}
.nav-btn:hover{color:var(--text);}
.nav-btn.active{color:var(--gold);border-bottom-color:var(--gold);}
.nav-btn.tbtn{color:#885500;}
.nav-btn.tbtn.active{color:#ffaa22;border-bottom-color:#ffaa22;}
.header-right{display:flex;gap:6px;align-items:center;}
.mode-badge{font-size:8px;letter-spacing:2px;text-transform:uppercase;padding:3px 8px;border:1px solid;}
.mode-badge.learner{color:var(--cat3);border-color:var(--cat3);}
.mode-badge.teacher{color:#ffaa22;border-color:#ffaa22;background:#1a0e00;}
.btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:10px;letter-spacing:1px;padding:5px 12px;cursor:pointer;transition:all .12s;text-transform:uppercase;display:inline-block;}
.btn:hover{border-color:var(--gold);color:var(--gold);}
.btn-gold{background:var(--gold-dim);border-color:var(--gold);color:var(--gold);}
.btn-gold:hover{background:var(--gold);color:#000;}
.btn-full{width:100%;text-align:center;}
.btn-sm{font-size:9px;padding:3px 8px;}
.btn-danger{border-color:#602020;color:#c44;}
.btn-danger:hover{background:#300;}
.btn-ghost{background:none;border-color:transparent;color:var(--muted);}
.btn-ghost:hover{color:var(--text);border-color:var(--border);}
input[type="file"]{display:none;}
.main{flex:1;overflow:hidden;display:flex;}
.view{display:none;width:100%;overflow:hidden;}
.view.active{display:flex;}
.scroll{overflow-y:auto;}
.scroll::-webkit-scrollbar{width:3px;}
.scroll::-webkit-scrollbar-thumb{background:var(--border2);}
#view-dash{flex-direction:row;}
.dash-left{flex:1;padding:20px 22px;overflow-y:auto;}
.dash-right{width:300px;border-left:1px solid var(--border);background:var(--surface);overflow-y:auto;padding:18px;}
.dash-profile{margin-bottom:20px;}
.dash-profile-name{font-size:18px;font-weight:700;cursor:pointer;display:inline-block;}
.dash-profile-name:hover{color:var(--gold);}
.dash-profile-input{font-family:var(--font);font-size:18px;font-weight:700;background:var(--surface2);border:1px solid var(--gold);color:var(--text);padding:2px 6px;width:240px;}
.dash-profile-input:focus{outline:none;}
.dash-profile-sub{font-size:10px;color:var(--muted);margin-top:3px;}
.section-label{font-size:9px;text-transform:uppercase;letter-spacing:3px;color:var(--muted);margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.skill-card{background:var(--surface);border:1px solid var(--border);padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:all .12s;}
.skill-card:hover{border-color:var(--gold);}
.skill-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.skill-card-name{font-size:13px;font-weight:700;}
.skill-card-cat{font-size:8px;letter-spacing:1px;text-transform:uppercase;}
.skill-card-level{font-size:10px;font-weight:700;text-align:right;}
.skill-bar-track{height:2px;background:var(--border);margin-bottom:6px;}
.skill-bar-fill{height:100%;transition:width .4s;}
.skill-card-meta{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);}
.skill-card.dashed{border-style:dashed;opacity:.7;}
.skill-card.empty-state{cursor:default;opacity:.4;display:flex;align-items:center;justify-content:center;padding:24px;font-size:10px;color:var(--muted);}
.skill-card.empty-state:hover{border-color:var(--border);}
.skill-grid-mini{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;}
.mini-cell{aspect-ratio:1;border:1px solid var(--border);cursor:pointer;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:all .12s;}
.mini-cell:hover{border-color:var(--gold);}
.mini-cell .mc-fill{position:absolute;inset:0;}
.mini-cell .mc-label{position:relative;font-size:8px;font-weight:700;z-index:1;}
.mini-cell::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:#111;border:1px solid var(--border2);color:var(--text);font-size:9px;padding:3px 7px;white-space:nowrap;z-index:50;pointer-events:none;opacity:0;transition:opacity .1s;}
.mini-cell:hover::after{opacity:1;}
.mini-cell.nc{cursor:default;opacity:.35;}
.mini-cell.nc:hover{border-color:var(--border);}
.mini-cell.nc::after{display:none;}
.recent-entry{padding:8px 0;border-bottom:1px solid var(--border);font-size:10px;}
.recent-entry-skill{font-weight:700;margin-bottom:2px;}
.recent-entry-meta{color:var(--muted);font-size:9px;}
.empty-msg{color:var(--muted);font-size:10px;padding:12px 0;}
#view-learn{flex-direction:column;}
.learn-header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;gap:12px;height:44px;flex-shrink:0;}
.learn-back{background:none;border:none;color:var(--muted);cursor:pointer;font-family:var(--font);font-size:12px;}
.learn-back:hover{color:var(--gold);}
.learn-skill-name{font-size:14px;font-weight:700;}
.learn-skill-cat{font-size:9px;letter-spacing:1px;text-transform:uppercase;margin-left:auto;}
.learn-tabs{background:var(--surface);border-bottom:1px solid var(--border);display:flex;padding:0 20px;flex-shrink:0;}
.learn-tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:var(--font);font-size:9px;letter-spacing:2px;text-transform:uppercase;padding:8px 14px;cursor:pointer;transition:all .12s;}
.learn-tab:hover{color:var(--text);}
.learn-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.learn-body{flex:1;overflow-y:auto;padding:24px;max-width:780px;}
.content-block{background:var(--surface);border:1px solid var(--border);padding:20px;margin-bottom:14px;}
.content-block-title{font-size:12px;font-weight:700;color:var(--gold);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.content-body{font-size:12px;line-height:1.9;color:var(--text);white-space:pre-wrap;font-family:var(--font);}
.content-empty{color:var(--muted);font-size:11px;font-style:italic;}
.quiz-q{background:var(--surface);border:1px solid var(--border);padding:18px;margin-bottom:12px;}
.quiz-q-num{font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;}
.quiz-q-text{font-size:13px;font-weight:700;margin-bottom:14px;line-height:1.5;}
.quiz-options{display:flex;flex-direction:column;gap:6px;}
.quiz-option{background:var(--surface2);border:1px solid var(--border);padding:9px 14px;cursor:pointer;transition:all .12s;font-size:11px;text-align:left;font-family:var(--font);color:var(--text);}
.quiz-option:hover:not(:disabled){border-color:var(--gold);}
.quiz-option.selected{border-color:var(--gold);background:var(--gold-dim);}
.quiz-option.correct{border-color:var(--cat3);background:var(--cat3b);color:#1fc87a;}
.quiz-option.wrong{border-color:var(--danger);background:#1a0000;color:#c44;}
.quiz-open-input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:11px;padding:10px;resize:vertical;min-height:90px;margin-top:8px;line-height:1.7;}
.quiz-open-input:focus{outline:none;border-color:var(--gold);}
.quiz-feedback{margin-top:10px;padding:8px 12px;font-size:10px;font-weight:700;letter-spacing:1px;}
.quiz-feedback.correct{color:#1fc87a;border-left:3px solid var(--cat3);}
.quiz-score-bar{background:var(--surface);border:1px solid var(--gold);padding:20px;margin-bottom:16px;text-align:center;}
.quiz-score-big{font-size:48px;font-weight:700;line-height:1;}
.quiz-score-lbl{font-size:10px;color:var(--muted);margin-top:6px;}
.pyr-wrap{background:var(--surface);border:1px solid var(--border);padding:16px;margin-bottom:14px;}
.pyr-title{font-size:9px;text-transform:uppercase;letter-spacing:3px;color:var(--muted);margin-bottom:14px;text-align:center;}
.pyr-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.pyr-key{font-size:9px;font-weight:700;color:var(--muted);width:20px;text-align:right;flex-shrink:0;}
.pyr-blocks{display:flex;gap:3px;}
.pyr-block{width:24px;height:24px;border:1px solid var(--border2);transition:all .2s;}
.pyr-block.filled{border-color:transparent;}
.pyr-block.locked{opacity:.15;}
.pyr-desc{font-size:9px;color:var(--muted);flex:1;}
.x-track{display:flex;gap:3px;flex:1;}
.x-pip{height:8px;flex:1;background:var(--border2);}
.log-note-area{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:11px;padding:8px;resize:none;height:54px;margin-bottom:8px;display:block;}
.log-note-area:focus{outline:none;border-color:var(--gold);}
.log-note-area::placeholder{color:var(--dim);}
.log-entry{border-left:2px solid var(--border2);padding:5px 10px;margin-bottom:8px;}
.log-entry-header{display:flex;justify-content:space-between;margin-bottom:2px;}
.log-entry-level{font-size:9px;font-weight:700;}
.log-entry-date{font-size:9px;color:var(--muted);}
.log-entry-note{font-size:9px;color:var(--muted);font-style:italic;}
.mastered-banner{border:1px solid var(--gold);color:var(--gold);text-align:center;padding:12px;font-size:11px;font-weight:700;letter-spacing:3px;margin-bottom:14px;background:var(--gold-dim);}
.progress-bar{height:2px;background:var(--border);margin:4px 0;}
.progress-bar-fill{height:100%;transition:width .4s;}
.progress-meta{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);}
#view-grid{flex-direction:column;overflow-y:auto;padding:20px;}
.grid-full{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:700px;}
.grid-cell{aspect-ratio:1;border:1px solid var(--border);cursor:pointer;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all .12s;padding:4px;}
.grid-cell:hover{border-color:var(--gold);z-index:5;}
.grid-cell .gc-fill{position:absolute;inset:0;}
.gc-num{font-size:8px;color:var(--muted);position:absolute;top:3px;left:4px;}
.gc-level{font-size:12px;font-weight:700;position:relative;z-index:1;}
.gc-name{font-size:7px;color:var(--muted);position:absolute;bottom:3px;text-align:center;overflow:hidden;width:90%;line-height:1.2;}
.grid-cell::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);background:#111;border:1px solid var(--border2);color:var(--text);font-size:9px;padding:3px 8px;white-space:nowrap;z-index:100;pointer-events:none;opacity:0;transition:opacity .1s;}
.grid-cell:hover::after{opacity:1;}
.grid-cell.nc{cursor:default;opacity:.35;}
.grid-cell.nc:hover{border-color:var(--border);}
.grid-cell.nc::after{display:none;}
#view-stats{flex-direction:column;overflow-y:auto;padding:20px;}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px;}
.sc{background:var(--surface);border:1px solid var(--border);padding:16px;}
.sc .sn{font-size:32px;font-weight:700;line-height:1;}
.sc .sl{font-size:8px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-top:5px;}
.cat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px;}
.cat-card{background:var(--surface);border:1px solid var(--border);padding:14px;}
.cat-name{font-size:10px;font-weight:700;margin-bottom:8px;}
.cat-bar-t{height:2px;background:var(--border);margin-bottom:6px;}
.cat-bar-f{height:100%;}
#view-teacher{flex-direction:row;}
.t-sidebar{width:240px;border-right:1px solid var(--border);background:var(--surface);overflow-y:auto;padding:16px;}
.t-main{flex:1;overflow-y:auto;padding:20px;}
.tsi{padding:10px 12px;border:1px solid var(--border);margin-bottom:6px;cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:8px;}
.tsi:hover{border-color:#ffaa22;}
.tsi.active{border-color:#ffaa22;background:#1a0e00;}
.tsi-name{font-size:11px;font-weight:700;flex:1;}
.tsi-num{font-size:9px;color:var(--muted);}
.ed-sec{background:var(--surface);border:1px solid var(--border);padding:16px;margin-bottom:14px;}
.ed-title{font-size:9px;text-transform:uppercase;letter-spacing:3px;color:#ffaa22;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
.t-input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:12px;padding:7px 10px;margin-bottom:8px;transition:border-color .12s;}
.t-input:focus{outline:none;border-color:#ffaa22;}
.t-ta{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:11px;padding:8px;resize:vertical;min-height:120px;line-height:1.7;transition:border-color .12s;}
.t-ta:focus{outline:none;border-color:#ffaa22;}
.t-ta::placeholder{color:var(--dim);}
.qei{background:var(--surface2);border:1px solid var(--border);padding:12px;margin-bottom:10px;}
.qei-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.qei-num{font-size:9px;font-weight:700;color:#ffaa22;}
.lbl{font-size:9px;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px;}
.pin-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:200;}
.pin-box{background:var(--surface);border:1px solid #ffaa22;padding:32px;text-align:center;width:320px;}
.pin-title{font-size:12px;font-weight:700;color:#ffaa22;margin-bottom:8px;letter-spacing:2px;}
.pin-hint{font-size:10px;color:var(--muted);margin-bottom:18px;}
.pin-input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:18px;padding:10px;text-align:center;letter-spacing:8px;margin-bottom:14px;}
.pin-input:focus{outline:none;border-color:#ffaa22;}
.pin-err{color:#c44;font-size:10px;margin-bottom:10px;height:16px;}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="logo-mark">25/100</span><span class="logo-div">/</span><span class="logo-tag">Learning Engine</span></div>
  <div class="header-nav">
    <button class="nav-btn active" data-view="dash">Dashboard</button>
    <button class="nav-btn" data-view="grid">Grid</button>
    <button class="nav-btn" data-view="stats">Stats</button>
    <button class="nav-btn tbtn" id="nav-teacher" data-view="teacher">Teacher ⚙</button>
  </div>
  <div class="header-right">
    <span class="mode-badge learner" id="mode-badge">Learner</span>
    <button class="btn btn-sm" id="btn-export">Export</button>
    <label class="btn btn-sm" for="hdr-import">Import</label>
    <input type="file" id="hdr-import" accept=".json">
  </div>
</header>
<div class="pin-overlay" id="pin-overlay" style="display:none">
  <div class="pin-box">
    <div class="pin-title" id="pin-title">Teacher Mode</div>
    <div class="pin-hint" id="pin-hint">Enter PIN</div>
    <input type="password" class="pin-input" id="pin-input" maxlength="8" placeholder="••••">
    <div class="pin-err" id="pin-err"></div>
    <div style="display:flex;gap:8px;justify-content:center;">
      <button class="btn btn-gold" id="pin-submit">Enter</button>
      <button class="btn" id="pin-cancel">Cancel</button>
    </div>
  </div>
</div>
<div class="main">
  <div id="view-dash" class="view active">
    <div class="dash-left">
      <div class="dash-profile">
        <div id="dp-name" class="dash-profile-name"></div>
        <input type="text" id="dp-input" class="dash-profile-input" style="display:none">
        <div class="dash-profile-sub" id="dp-sub"></div>
      </div>
      <div style="margin-bottom:24px;"><div class="section-label">Continue Learning</div><div id="active-list"></div></div>
      <div><div class="section-label">Skill Overview</div><div class="skill-grid-mini" id="mini-grid"></div></div>
    </div>
    <div class="dash-right scroll">
      <div class="section-label" style="margin-bottom:12px;">Recent Activity</div>
      <div id="dash-recent"></div>
      <div style="margin-top:20px;" class="section-label">Quick Stats</div>
      <div id="dash-stats" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;"></div>
    </div>
  </div>
  <div id="view-learn" class="view" style="flex-direction:column;">
    <div class="learn-header">
      <button class="learn-back" id="learn-back">← Back</button>
      <div class="learn-skill-name" id="learn-title"></div>
      <div class="learn-skill-cat" id="learn-cat"></div>
    </div>
    <div class="learn-tabs">
      <button class="learn-tab active" data-tab="lessons">Lessons</button>
      <button class="learn-tab" data-tab="exercises">Exercises</button>
      <button class="learn-tab" data-tab="quiz">Quiz</button>
      <button class="learn-tab" data-tab="progress">Progress</button>
    </div>
    <div class="learn-body scroll" id="learn-body"></div>
  </div>
  <div id="view-grid" class="view" style="flex-direction:column;overflow-y:auto;padding:20px;">
    <div class="section-label" style="margin-bottom:14px;">All Skills</div>
    <div class="grid-full" id="main-grid"></div>
  </div>
  <div id="view-stats" class="view" style="flex-direction:column;overflow-y:auto;padding:20px;">
    <div class="section-label">Overview</div>
    <div class="stats-row" id="stats-row"></div>
    <div class="section-label">By Category</div>
    <div class="cat-row" id="cat-row"></div>
    <div class="section-label">All Skills</div>
    <div id="all-skills-list"></div>
  </div>
  <div id="view-teacher" class="view">
    <div class="t-sidebar scroll">
      <div class="section-label" style="color:#ffaa22;margin-bottom:12px;">Skills</div>
      <div id="t-skill-list"></div>
      <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px;">
        <button class="btn btn-sm btn-full" id="btn-add-skill">+ Add Skill</button>
        <button class="btn btn-sm" id="btn-set-pin">Set PIN</button>
        <button class="btn btn-sm btn-danger" id="btn-exit-teacher">Exit Teacher Mode</button>
      </div>
    </div>
    <div class="t-main scroll" id="t-main"><div style="color:var(--muted);font-size:11px;padding:40px;text-align:center;">Select a skill to edit</div></div>
  </div>
</div>
<script>
const CATS=[{id:1,name:"Cognitive",color:"#b87200",bg:"#180f00"},{id:2,name:"Communication",color:"#1a55bb",bg:"#070e20"},{id:3,name:"Emotional",color:"#128550",bg:"#031508"},{id:4,name:"Practical",color:"#a84000",bg:"#180800"},{id:5,name:"Custom",color:"#888",bg:"#1a1a1a"}];
const MAX_SKILLS=25,MAX_ATT=160;

function starterCurriculum(){return[
{id:1,name:"Critical Thinking",description:"Analysing and evaluating information objectively before accepting it or acting on it.",catId:1,locked:false,content:{
lessons:[
{id:"l1a",title:"What is Critical Thinking?",body:"Critical thinking is the disciplined process of actively analysing, evaluating, and synthesising information gathered from observation, experience, or communication — before accepting it as true or acting on it.\n\nMost people believe they think critically. Most people don't.\n\nThe default human mode is reactive: we receive information, it matches or clashes with what we already believe, and we accept or reject it on that basis. Critical thinking interrupts that reflex.\n\nWHY IT MATTERS\n\nEvery important decision you make — about money, relationships, career, health — is based on information and reasoning. If your reasoning is flawed, your decisions will be too. Critical thinking is not an academic skill. It is a survival skill.\n\nTHE CORE HABITS OF CRITICAL THINKERS\n\n1. They question assumptions — especially their own.\n2. They seek evidence before accepting claims.\n3. They consider multiple perspectives.\n4. They are comfortable with uncertainty.\n5. They change their minds when evidence warrants it.\n\nWHAT CRITICAL THINKING IS NOT\n\nIt is not cynicism. It is not rejecting everything. A critical thinker can arrive at firm conclusions — but they know HOW they arrived there."},
{id:"l1b",title:"Evaluating Claims and Evidence",body:"Every claim you encounter deserves evaluation. Here is a systematic approach.\n\nTHE CLAIM CHECKLIST\n\n1. WHO is making this claim?\n   Are they qualified? Do they have a conflict of interest?\n\n2. WHAT evidence is provided?\n   Is it anecdotal (one story) or systematic (many cases, controlled)?\n\n3. WHERE does the evidence come from?\n   Primary source (original study) or secondary (someone reporting on it)?\n\n4. HOW was the evidence gathered?\n   Sample size? Methodology? Were variables controlled?\n\n5. WHAT alternative explanations exist?\n   Could the same data be explained differently?\n   Correlation ≠ causation.\n\nSTRONG vs WEAK EVIDENCE\n\nStrong: large studies, peer-reviewed, replicated, no obvious conflict of interest.\nWeak: anecdotes, testimonials, expert opinion alone, studies funded by interested parties.\n\nThe goal is not to dismiss — it is to calibrate. How confident should you be?"},
{id:"l1c",title:"Common Logical Fallacies",body:"A logical fallacy is an error in reasoning that makes an argument invalid, even if the conclusion happens to be true.\n\nAD HOMINEM — Attacking the person instead of the argument.\n\"You can't trust what she says about nutrition, she's overweight.\"\n\nSTRAW MAN — Misrepresenting someone's position to make it easier to attack.\n\"You want to reduce defence spending? So you want the country defenceless?\"\n\nFALSE DICHOTOMY — Presenting two options as if they're the only ones.\n\"You're either with us or against us.\"\n\nAPPEAL TO AUTHORITY — Citing an authority as proof of a claim.\n\"This scientist agrees, so I must be right.\"\n\nSLIPPERY SLOPE — Claiming one event will inevitably lead to an extreme outcome.\n\"If we allow this minor change, everything will collapse.\"\n\nCONFIRMATION BIAS — Seeking only information that confirms what you already believe.\nThis is the most dangerous fallacy because it's mostly invisible to the person doing it.\n\nSpotting fallacies doesn't mean the conclusion is wrong — it means the argument doesn't prove the conclusion."}
],
exercises:[
{id:"e1a",title:"Claim Audit",body:"Find three claims from different sources today — a news article, a social media post, an advertisement, or something someone told you.\n\nFor each claim, work through the checklist:\n— Who is making the claim?\n— What evidence is provided?\n— Does the evidence support the conclusion?\n— What might be missing?\n— How confident should you be? (0–100%)\n\nWrite a short paragraph for each. The goal is not to debunk — it is to calibrate your confidence appropriately."},
{id:"e1b",title:"Fallacy Hunt",body:"Read any opinion piece, editorial, or argument you find today.\n\nIdentify at least TWO logical fallacies. For each:\n— Name the fallacy\n— Quote or describe where it appears\n— Explain why it is a fallacy\n— Does the overall argument survive without that fallacy?\n\nIf you can't find fallacies, write about why the argument holds up."}
],

{id:"q1b",question:"An 'ad hominem' argument attacks the quality of someone's evidence rather than their character.",type:"tf",options:[],correct:"False"},
{id:"q1c",question:"A study shows coffee drinkers live longer. This is most likely:",type:"mc",options:["A proven cause-effect relationship","A correlation with many possible explanations","A clinical trial","Proven by expert opinion"],correct:"A correlation with many possible explanations"},

{id:2,name:"Active Listening",description:"Fully concentrating on and understanding a speaker, rather than passively hearing words.",catId:2,locked:false,content:{
lessons:[
{id:"l2a",title:"Hearing vs. Listening",body:"You hear with your ears. You listen with your mind.\n\nHearing is automatic. Listening is a choice. It requires attention, effort, and the suspension of your own agenda.\n\nResearch shows people retain only 25–50% of what they hear in a conversation. We think we're listening. We're mostly waiting to speak.\n\nWHY LISTENING IS RARE\n\nWhen someone speaks, our brains simultaneously:\n— Process the words\n— Form our own response\n— Judge and evaluate what's being said\n— Get distracted by environment or emotion\n\nThe result: most conversations are two people taking turns talking, not genuinely connecting.\n\nTHE REWARD\n\nGood listeners are rare. When someone feels truly heard, they trust more, share more, and think of you as more intelligent and empathetic — often without you having said very much at all."},
{id:"l2b",title:"The Six Elements of Active Listening",body:"Active listening is not passive silence. It is engaged, visible attention.\n\n1. PHYSICAL PRESENCE\nFace the speaker. Remove distractions. Maintain comfortable eye contact.\n\n2. WITHHOLD JUDGEMENT\nDo not evaluate, advise, or conclude while they are still speaking. Let them finish completely.\n\n3. REFLECT AND PARAPHRASE\n\"So if I understand correctly, you're saying...\" This confirms you were listening and lets them correct misunderstanding.\n\n4. ASK GENUINE QUESTIONS\n\"What happened next?\" \"How did that make you feel?\" These show engagement and deepen understanding.\n\n5. NOTICE THE UNSPOKEN\nPay attention to tone, pace, and body language. Often the most important thing being communicated is not in the words.\n\n6. MANAGE YOUR OWN REACTIONS\nIf something triggers a reaction in you, notice it — and set it aside. Your reaction is not the topic of this conversation.\n\nTHE TRAP\nListening not to understand but to find the moment you can speak. You can feel it — a slight impatience, already composing your reply. When you catch this, bring your attention back."},
{id:"l2c",title:"Barriers and How to Remove Them",body:"EXTERNAL BARRIERS\n\nEnvironment: noise, visual distractions. Move to a better space when a conversation matters.\n\nTechnology: your phone's presence alone reduces conversation quality. Phone away, not just silent.\n\nINTERNAL BARRIERS\n\nThe Planning Fallacy: mentally rehearsing your response while someone speaks. Remind yourself you can think after they finish.\n\nEmotional Filtering: strong reactions shut down listening. Notice the reaction, label it internally, return to the speaker.\n\nAssumptions: thinking you know what they'll say and stopping listening. Treat each sentence as new information.\n\nFatigue: physical states deeply affect listening quality. If a conversation matters, be in a state to have it well.\n\nTHE ONE PRACTICE\n\nBefore your next important conversation, make one decision: 'My job right now is to understand this person, not to respond.' Notice what changes."}
],
exercises:[
{id:"e2a",title:"The Pure Listen",body:"Have a conversation where you set one rule: for the first 5 minutes, you only ask questions. No stories about yourself. No advice. No 'I know exactly what you mean.' Just questions and reflections.\n\nAfterwards, write:\n— What was difficult about this?\n— What did you learn that you might have missed?\n— How did it seem to affect the other person?"},
{id:"e2b",title:"Recall Test",body:"After your next significant conversation, within 30 minutes write from memory:\n\n1. Three specific things the other person said\n2. One thing they seemed to care about most\n3. One question they asked you\n4. Their emotional state during the conversation\n\nThen check your recall — did you actually listen?\n\nDo this three times this week. Notice whether your recall improves."}
],
quiz:[
{id:"q2a",question:"On average, people retain approximately what percentage of what they hear?",type:"mc",options:["75–90%","50–75%","25–50%","Less than 10%"],correct:"25–50%"},
{id:"q2b",question:"Active listening means staying quiet and letting the other person finish before you speak.",type:"tf",options:[],correct:"False"},
{id:"q2c",question:"Paraphrasing what someone said serves what purpose?",type:"mc",options:["Shows off your vocabulary","Confirms understanding and lets them correct misinterpretation","Signals you want to speak","Changes the subject politely"],correct:"Confirms understanding and lets them correct misinterpretation"},
{id:"q2d",question:"Having your phone face-down on the table has no effect on conversation quality.",type:"tf",options:[],correct:"False"},
{id:"q2e",question:"Which is an example of a genuine follow-up question?",type:"mc",options:["'Have you tried meditation?'","'I had the same thing happen to me.'","'That sounds hard. What happened next?'","'You should probably talk to someone.'"],correct:"'That sounds hard. What happened next?'"},

{id:3,name:"Emotional Regulation",description:"Understanding, managing, and responding to emotions in healthy and effective ways.",catId:3,locked:false,content:{
lessons:[
{id:"l3a",title:"Emotions Are Information, Not Problems",body:"The first thing to understand: emotions are not your enemy.\n\nEmotions are biological signals — rapid, often unconscious responses that evolved to help you navigate your environment. Fear warns of danger. Anger signals boundary violations. Sadness marks loss. Joy reinforces what's working.\n\nThe problem is not that we have strong emotions. Modern life triggers ancient emotional systems constantly, and our instinctive responses — designed for immediate physical threats — are often counterproductive in workplaces and relationships.\n\nTHE MISUNDERSTANDING\n\nMany people think regulation means suppression: don't feel it, push it down, project calm regardless. This doesn't work. Suppressed emotions don't disappear — they surface later, harder, in situations where the costs are higher.\n\nEmotional regulation means:\n— Recognising what you're feeling and why\n— Deciding how to respond rather than reacting automatically\n— Expressing emotions in ways that serve your goals and relationships\n\nTHE BODY CONNECTION\n\nEmotions are physical before they are mental. Before you consciously feel angry, your heart rate has already increased. Learning to read body signals gives you a few seconds of warning — which is exactly the window you need."},
{id:"l3b",title:"The Regulation Toolkit",body:"TOOL 1: NAMING\nLabelling an emotion reduces its intensity. 'I'm feeling anxious' activates your reasoning brain and quiets the threat-response brain. Be specific. 'Frustrated' is more useful than 'bad.'\n\nTOOL 2: THE PAUSE (6-SECOND RULE)\nThe physiological peak of an emotional response lasts approximately 6 seconds. If you avoid acting during those seconds, you're no longer reacting — you're choosing.\n\nTOOL 3: BOX BREATHING\n4 counts in → 4 hold → 4 out → 4 hold. Repeat 4 cycles. This directly activates the parasympathetic nervous system. Measurable. It works.\n\nTOOL 4: REFRAMING\nAsk: is the interpretation I'm putting on this the only one? 'They're ignoring me' vs. 'They're probably distracted.' Different interpretation = different emotional response.\n\nTOOL 5: CONTEXTUAL RELEASE\nSome emotions need processing, not management. Physical exercise, writing, talking to someone you trust, or simply sitting with the feeling — all valid.\n\nCHOOSING YOUR TOOL\nIn a meeting: pause and breathe. Processing grief: time and support. The skill is knowing which tool fits."},
{id:"l3c",title:"Triggers, Patterns, and the Long Game",body:"IDENTIFYING YOUR TRIGGERS\n\nA trigger is a stimulus that produces a disproportionate emotional response — larger or faster than the situation objectively warrants.\n\nCommon categories:\n— Feeling ignored or dismissed\n— Feeling criticised or judged\n— Loss of control\n— Perceived unfairness\n— Reminders of past difficult experiences\n\nTriggers are not weaknesses. They are information about what matters to you. But unexamined triggers run your life without your consent.\n\nTHE LOG PRACTICE\n\nFor one week, when you notice a strong emotional response, write:\n— Situation (what happened)\n— Emotion (name it precisely)\n— Intensity (1–10)\n— Body sensation (where?)\n— Response (what did you do?)\n— Later: was your response proportionate?\n\nPatterns will emerge within days.\n\nLONG-TERM REGULATION\n\nRegulation capacity is heavily influenced by baseline state. Sleep-deprived, chronically stressed people have significantly reduced regulation capacity — not moral failure, but physiology.\n\nThe most powerful regulation practice is often not a technique. It's sleep."}
],
exercises:[
{id:"e3a",title:"3-Day Emotion Log",body:"For three consecutive days, keep a simple log every time you notice a significant emotional response.\n\nFor each entry:\n— Time and situation\n— Emotion (specific — not just 'bad')\n— Body sensation (where did you feel it?)\n— What triggered it\n— How you responded\n— Was the response effective?\n\nAfter 3 days: What are your most common emotions? What tends to trigger them? Are there times of day you're more reactive?"},
{id:"e3b",title:"Box Breathing Practice",body:"Learn and practise box breathing this week. Use it at least once daily.\n\nTHE TECHNIQUE:\n1. Breathe IN for 4 counts\n2. HOLD for 4 counts\n3. Breathe OUT for 4 counts\n4. HOLD for 4 counts\n5. Repeat 4 cycles\n\nUse it:\n— Before a difficult conversation\n— When you notice physical stress signs\n— As a morning practice\n— During any moment of transition\n\nAfter each session: what was your state before? After? Build the habit so it's available when needed."}
],
quiz:[
{id:"q3a",question:"Emotional regulation primarily means suppressing emotions so others cannot see them.",type:"tf",options:[],correct:"False"},
{id:"q3b",question:"Naming an emotion out loud or in writing tends to:",type:"mc",options:["Intensify it","Have no measurable effect","Reduce its intensity","Make you appear weak"],correct:"Reduce its intensity"},
{id:"q3c",question:"The physiological peak of an emotional response lasts approximately:",type:"mc",options:["1–2 seconds","6 seconds","30 seconds","Several minutes"],correct:"6 seconds"},
{id:"q3d",question:"A 'trigger' in this context means:",type:"mc",options:["Any emotional response","A response larger than the situation warrants","A traumatic memory","A physical body sensation"],correct:"A response larger than the situation warrants"},
{id:"q3e",question:"Chronic sleep deprivation has little effect on emotional regulation ability.",type:"tf",options:[],correct:"False"},
{id:"q3f",question:"Describe a recent situation where your response felt disproportionate. What was probably happening, and what would a regulated response look like?",type:"open",options:[],correct:""}

{id:4,name:"Time Management",description:"Planning and prioritising your time to accomplish what matters most.",catId:4,locked:false,content:{
lessons:[
{id:"l4a",title:"Why Time Management Fails",body:"Most time management advice fails because it treats a cognitive problem as a scheduling problem.\n\nYou don't have a time problem. You have a priority problem and an attention problem.\n\nTime is fixed. Every person has 24 hours. What differs is what they do with those hours, and why. Poor time managers are not lazy — they are busy. They're just busy with the wrong things.\n\nTHE TWO REAL PROBLEMS\n\n1. PRIORITY CONFUSION\nWe treat urgency as importance. Something urgent feels pressing and rewards us with the satisfaction of completion. Something important is often less visible, rarely urgent — and consistently loses out.\n\nMost of what drives long-term success — deep work, relationships, learning, health — is important but rarely urgent.\n\n2. ATTENTION FRAGMENTATION\nModern environments are engineered to fragment your attention. After an interruption, it takes an average of 23 minutes to return to the same level of focused work.\n\nTHE COST\n\nEvery commitment is made with time. Time spent on one thing cannot be spent on another. The decision of what to do with your time is, at its core, the decision of what kind of life to build."},
{id:"l4b",title:"The Priority Matrix",body:"The Eisenhower Matrix is the most useful prioritisation tool in existence.\n\nQ1 — URGENT + IMPORTANT (Do immediately)\nCrises, deadlines, emergencies. You can't avoid these, but living predominantly here means planning has failed.\n\nQ2 — NOT URGENT + IMPORTANT (Schedule and protect)\nPlanning, learning, relationships, health, strategic thinking. This is where all long-term success is built. Most people chronically under-invest here. Deliberately expand this quadrant.\n\nQ3 — URGENT + NOT IMPORTANT (Delegate or minimise)\nInterruptions, other people's priorities, many meetings, many emails. These feel productive. They are not.\n\nQ4 — NOT URGENT + NOT IMPORTANT (Eliminate)\nMindless scrolling, low-value entertainment. Some rest is necessary. Passive consumption is rarely restorative.\n\nTHE PRACTICE\n\nAt the start of each week, write your tasks and categorise them. Ask: am I spending most time in Q2? If not, what is pulling me into Q1 and Q3?"},
{id:"l4c",title:"Planning, Blocking, Protecting",body:"A decision made in advance is worth five made in the moment.\n\nTHE WEEKLY REVIEW (30 minutes, once a week)\n1. Review commitments and deadlines for the coming week\n2. Identify your 3 most important outcomes\n3. Block time for deep work on those outcomes\n4. Leave buffer — unexpected things will happen\n\nTHE DAILY PLAN (5 minutes, each morning)\n1. Identify your 1–3 most important tasks for today\n2. Do the hardest one first, before email and messages\n3. Protect your best hours for your most important work\n\nTIME BLOCKING\nAssign tasks to specific blocks. 'I will write from 9–11am' is vastly more effective than 'I'll get to it today.'\n\nPROTECTING YOUR BLOCKS\n'I'm not available then — I can do that at [other time].' This is not rudeness. It is the management of your most finite resource.\n\nTHE 2-MINUTE RULE\nIf a task takes less than 2 minutes, do it immediately. If longer, schedule it."}
],
exercises:[
{id:"e4a",title:"Priority Matrix Audit",body:"Take your current task list and place each item into the four quadrants:\n\nQ1: Urgent + Important\nQ2: Important, Not Urgent\nQ3: Urgent, Not Important\nQ4: Not Urgent, Not Important\n\nThen ask:\n— What percentage of my time is in each quadrant?\n— What am I doing in Q3/Q4 that I could reduce or eliminate?\n— What Q2 activities have I been postponing that actually matter most?\n\nWrite a short reflection on what this reveals."},
{id:"e4b",title:"One Week Time Blocking",body:"For the coming week, plan your time in advance.\n\nStep 1: Identify 3 outcomes you want to achieve this week.\nStep 2: Block specific 90-minute to 2-hour windows for each.\nStep 3: Protect those blocks — treat them like meetings you cannot miss.\nStep 4: At the end of the week, review:\n— Did you protect your blocks?\n— If not, what overrode them?\n— What did you learn about how your time is actually controlled?"}
],

{id:"q4a",question:"In the Eisenhower Matrix, Q2 tasks are:",type:"mc",options:["Urgent and important — do immediately","Important but not urgent — schedule and protect","Urgent but not important — delegate","Neither urgent nor important — eliminate"],correct:"Important but not urgent — schedule and protect"},
{id:"q4b",question:"Multitasking has been shown to significantly increase productivity.",type:"tf",options:[],correct:"False"},
{id:"q4c",question:"After an interruption, it takes on average how long to return to fully focused work?",type:"mc",options:["2–3 minutes","5–10 minutes","23 minutes","Over an hour"],correct:"23 minutes"},
{id:"q4d",question:"The 'planning fallacy' refers to:",type:"mc",options:["Making too many plans","Consistently underestimating how long tasks take","Planning too far ahead","Over-scheduling your calendar"],correct:"Consistently underestimating how long tasks take"},
{id:"q4e",question:"Doing your most important task first thing in the morning is recommended because:",type:"mc",options:["Mornings are quieter","Willpower and focus are typically highest early in the day","It makes you feel productive all day","Time of day doesn't actually matter"],correct:"Willpower and focus are typically highest early in the day"},

{id:5,name:"Financial Literacy",description:"Understanding how money works — income, expenses, saving, debt, and long-term security.",catId:4,locked:false,content:{
lessons:[
{id:"l5a",title:"The Fundamental Equation",body:"All personal finance rests on one equation:\n\nINCOME − EXPENSES = GAP\n\nYour gap is everything. If it is positive, you have money to save, invest, or pay down debt. If zero or negative, you are running in place or falling behind — regardless of how much you earn.\n\nThis is the first place most financial education fails: it focuses on investment returns when the foundational problem is that people don't know their gap. Many high earners have a zero gap. Many modest earners build significant wealth by managing their gap well.\n\nKNOW YOUR ACTUAL INCOME\nYour income is not your salary. It is your take-home pay after taxes and deductions. Know this number precisely.\n\nEXPENSES: THE CATEGORIES\nFixed: same every month — rent, insurance, subscriptions, loan payments. Predictable.\nVariable: change monthly — food, transport, entertainment. This is where most people underestimate.\nIrregular: annual or quarterly — car maintenance, gifts, holidays. These are where budgets most commonly fail because they are not included in the monthly calculation.\n\nTHE GOAL\nKnow your gap. Track it monthly. Grow it over time — by increasing income, reducing expenses, or both."},
{id:"l5b",title:"Budgeting and the 50/30/20 Framework",body:"A budget is not a punishment. It is a plan for your money.\n\nTHE 50/30/20 FRAMEWORK\n\n50% — NEEDS\nEssential expenses: housing, utilities, food, basic transport, insurance, minimum debt payments. If your needs exceed 50% of income, this is your first problem to solve.\n\n30% — WANTS\nLifestyle: restaurants, entertainment, subscriptions, hobbies. This category expands to fill whatever space you give it. The key is making it conscious.\n\n20% — SAVINGS AND DEBT REPAYMENT\nEmergency fund, retirement, extra debt payments, investment. This determines your long-term financial security. Most people skip this first when under pressure.\n\nTRACKING: THE ONLY WAY IT WORKS\nA budget that is not tracked is not a budget — it is a wish list. Check your bank statement weekly. The method matters less than the consistency.\n\nTHE PSYCHOLOGICAL BARRIER\nMost people avoid tracking because they don't want to face the numbers. This avoidance makes everything worse. The numbers are neutral. They are information. Face them."},
{id:"l5c",title:"Saving, Debt, and Compound Interest",body:"Two forces work on your money simultaneously.\n\nCOMPOUND INTEREST\n\nEarning interest on your interest. Exponential growth, and time is its only requirement.\n\n£1,000 at 7% average annual return:\nAfter 10 years: £1,967\nAfter 20 years: £3,870\nAfter 30 years: £7,612\n\nThe same principle works in reverse with debt. Credit card debt at 20% compounds against you at the same rate.\n\nTHE EMERGENCY FUND: FIRST PRIORITY\n\nBefore investing: build 3–6 months of essential expenses in an easy-access account. This eliminates the most common cause of financial disaster — an unexpected cost that forces debt.\n\nGOOD DEBT vs BAD DEBT\n\nGood debt: low interest rate, finances something that grows in value — mortgage, education for a higher-earning career.\n\nBad debt: high interest rate, finances consumption — credit cards for lifestyle, payday loans.\n\nThe priority: eliminate high-interest debt before investing. The guaranteed return from paying off 20% credit card debt beats most investment returns.\n\nTHE START RULE\nThe best time to start was ten years ago. The second best is today."}
],
exercises:[
{id:"e5a",title:"Know Your Gap",body:"Calculate your actual financial gap this week.\n\n1. Find your exact monthly take-home income.\n\n2. List every fixed expense: rent/mortgage, utilities, subscriptions, loan payments, insurance. Total them.\n\n3. Estimate variable expenses for last month: all food (groceries, eating out, coffee), transport, clothing, entertainment. Be honest. Check your bank statement.\n\n4. Add a monthly estimate for irregular expenses (annual costs ÷ 12).\n\n5. Calculate: Income − Total Expenses = Gap\n\nWrite down what you find. Is the gap what you expected? What expenses surprised you?"},
{id:"e5b",title:"50/30/20 Audit",body:"Take last month's spending and categorise every expense:\n— Needs (50% target)\n— Wants (30% target)\n— Savings/Debt (20% target)\n\nCompare your actual percentages to the targets.\n\nWrite:\n— Where are you over the target?\n— What changes would move you closer to 20% savings?\n— What one want could you reduce this month without significantly affecting quality of life?"}
],
quiz:[
{id:"q5a",question:"Your 'gap' in personal finance is:",type:"mc",options:["The difference between what you earn and want to earn","The amount left after income minus all expenses","The gap between your savings goal and current savings","The difference between your income and national average"],correct:"The amount left after income minus all expenses"},
{id:"q5b",question:"In the 50/30/20 framework, the 20% is for:",type:"mc",options:["Needs","Wants","Savings and debt repayment","Discretionary spending"],correct:"Savings and debt repayment"},
{id:"q5c",question:"Compound interest works in your favour when saving, but has no effect on debt.",type:"tf",options:[],correct:"False"},
{id:"q5d",question:"An emergency fund should cover:",type:"mc",options:["One month of income","One month of essential expenses","3–6 months of essential expenses","One year of total spending"],correct:"3–6 months of essential expenses"},

function load(){

    const r=localStorage.getItem("25-100-v2b");
    if(r){
      state=JSON.parse(r);
      // Migration: if no skill has any content, inject starter curriculum into existing skill slots

      if(!hasAnyContent){
        const curriculum=starterCurriculum();
        // Replace first N skills with curriculum, preserve any progress that already existed
        curriculum.forEach((cs,i)=>{
          if(i<state.skills.length){
            const existing=state.skills[i];
            state.skills[i]={...cs,x:existing.x||0,vPieces:existing.vPieces||0,vAtt:existing.vAtt||0,ivPieces:existing.ivPieces||0,ivAtt:existing.ivAtt||0,iiiPieces:existing.iiiPieces||0,iiiAtt:existing.iiiAtt||0,iiPieces:existing.iiPieces||0,iiAtt:existing.iiAtt||0,iPieces:existing.iPieces||0,iAtt:existing.iAtt||0,log:existing.log||[],lastActivity:existing.lastActivity||null};
          }else{
            state.skills.push(cs);
          }
        });
        save();
      }
      return;
    }
  }catch(e){}
  state=freshState();
}
function exportData(){const b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=`25-100_${state.profileName.replace(/\s+/g,"_")}_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(u);}
function importData(file){if(!file)return;const r=new FileReader();r.onload=e=>{try{const d=JSON.parse(e.target.result);if(d.skills){state=d;save();learnIdx=null;editIdx=null;renderAll();}else alert("Invalid file.");}catch{alert("Could not parse JSON.");}};r.readAsText(file);}

function totalAtt(s){return s.x+s.vAtt+s.vPieces*10+s.ivAtt+s.ivPieces*10+s.iiiAtt+s.iiiPieces*10+s.iiAtt+s.iiPieces*10+s.iAtt+s.iPieces*10;}
function pct(s){return Math.min(100,Math.round(totalAtt(s)/MAX_ATT*100));}
function mastered(s){return s.iPieces>=1;}
function hasContent(s){return s.content.lessons.length>0||s.content.exercises.length>0||s.content.quiz.length>0;}
function currentLevel(s){if(s.iPieces>=1)return"I";if(s.iiPieces>=2)return"II";if(s.iiiPieces>=3)return"III";if(s.ivPieces>=4)return"IV";if(s.vPieces>=5)return"V";if(s.x>=10)return"V→";if(s.x>0)return"X";return"—";}
function currentPhase(s){if(s.iPieces>=1)return"done";if(s.iiPieces>=2)return"i";if(s.ivPieces>=4)return"iii";if(s.iiiPieces>=3)return"ii";if(s.vPieces>=5)return"iv";if(s.x>=10)return"v";return"x";}
function logAttempt(idx,note,qs,qt){const s=state.skills[idx];if(mastered(s))return;const ph=currentPhase(s),lv=currentLevel(s);if(ph==="x"){s.x=Math.min(10,s.x+1);}else if(ph==="v"){s.vAtt++;if(s.vAtt>=10){s.vPieces=Math.min(5,s.vPieces+1);s.vAtt=0;}}else if(ph==="iv"){s.ivAtt++;if(s.ivAtt>=10){s.ivPieces=Math.min(4,s.ivPieces+1);s.ivAtt=0;}}else if(ph==="iii"){s.iiiAtt++;if(s.iiiAtt>=10){s.iiiPieces=Math.min(3,s.iiiPieces+1);s.iiiAtt=0;}}else if(ph==="ii"){s.iiAtt++;if(s.iiAtt>=10){s.iiPieces=Math.min(2,s.iiPieces+1);s.iiAtt=0;}}else if(ph==="i"){s.iAtt++;if(s.iAtt>=10){s.iPieces=1;s.iAtt=0;}}const ts=new Date().toISOString();s.lastActivity=ts;s.log.unshift({ts,note:note||"",quizScore:qs,quizTotal:qt,level:lv});if(s.log.length>60)s.log=s.log.slice(0,60);save();}
function catOf(s){return CATS[(s.catId||1)-1]||CATS[4];}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function ea(s){return String(s||"").replace(/'/g,"\\'");}
function relTime(ts){const d=Date.now()-new Date(ts).getTime(),m=Math.floor(d/60000);if(m<1)return"just now";if(m<60)return`${m}m ago`;const h=Math.floor(m/60);if(h<24)return`${h}h ago`;return`${Math.floor(h/24)}d ago`;}
let _uid=Date.now();function uid(){return(++_uid).toString(36);}

function renderDash(){
  document.getElementById("dp-name").textContent=state.profileName;
  const mc=state.skills.filter(mastered).length,st=state.skills.filter(s=>totalAtt(s)>0&&!mastered(s)).length;
  document.getElementById("dp-sub").textContent=`${mc} mastered · ${st} in progress · ${state.skills.length-mc-st} not started`;
  const active=state.skills.filter(s=>totalAtt(s)>0&&!mastered(s)&&hasContent(s)).sort((a,b)=>(b.lastActivity||"").localeCompare(a.lastActivity||"")).slice(0,3);
  const next=state.skills.find(s=>totalAtt(s)===0&&hasContent(s));
  let ah="";
  if(!active.length&&!next){ah=`<div class="skill-card empty-state">Click Teacher ⚙ to add content to your skills</div>`;}
  active.forEach(s=>{const i=state.skills.indexOf(s),c=catOf(s),p=pct(s);ah+=`<div class="skill-card" onclick="openLearn(${i})"><div class="skill-card-top"><div><div class="skill-card-cat" style="color:${c.color}">${c.name}</div><div class="skill-card-name">${esc(s.name)}</div></div><div class="skill-card-level" style="color:${c.color}">${currentLevel(s)}<br><span style="font-size:9px;color:var(--muted)">${p}%</span></div></div><div class="skill-bar-track"><div class="skill-bar-fill" style="width:${p}%;background:${c.color}"></div></div><div class="skill-card-meta"><span>${totalAtt(s)} sessions</span><span>${s.lastActivity?relTime(s.lastActivity):"never"}</span></div></div>`;});
  if(next){const i=state.skills.indexOf(next),c=catOf(next);ah+=`<div class="skill-card dashed" onclick="openLearn(${i})"><div class="skill-card-top"><div><div class="skill-card-cat" style="color:${c.color}">${c.name}</div><div class="skill-card-name">${esc(next.name)}</div></div><div class="skill-card-level" style="color:var(--muted)">Start →</div></div><div style="font-size:9px;color:var(--muted);margin-top:4px">${next.content.lessons.length} lessons · ${next.content.quiz.length} quiz questions</div></div>`;}
  document.getElementById("active-list").innerHTML=ah;
  let mg="";
  for(let i=0;i<MAX_SKILLS;i++){if(i<state.skills.length){const s=state.skills[i],c=catOf(s),p=pct(s),m=mastered(s),nc=!hasContent(s);const op=nc?0:(m?.6:p>0?.1+p/100*.3:0);mg+=`<div class="mini-cell${nc?" nc":""}" data-tip="${i+1}. ${s.name}" ${nc?"":`onclick="openLearn(${i})"`}><div class="mc-fill" style="background:${c.color};opacity:${op}"></div><div class="mc-label" style="color:${p>0||m?c.color:"var(--dim)"}">${m?"✓":p>0?currentLevel(s):(i+1)}</div></div>`;}else{mg+=`<div class="mini-cell nc"><div class="mc-label" style="color:var(--dim)">${i+1}</div></div>`;}}
  document.getElementById("mini-grid").innerHTML=mg;
  const all=[];state.skills.forEach((s,i)=>s.log.forEach(e=>all.push({...e,sn:s.name,ci:i,cc:catOf(s).color})));all.sort((a,b)=>b.ts.localeCompare(a.ts));
  document.getElementById("dash-recent").innerHTML=all.length?all.slice(0,8).map(e=>`<div class="recent-entry"><div class="recent-entry-skill" style="color:${e.cc}">${esc(e.sn)}${e.quizScore!=null?` <span style="float:right;color:var(--gold)">${e.quizScore}/${e.quizTotal}</span>`:""}</div><div class="recent-entry-meta">${e.level} · ${relTime(e.ts)}${e.note?` — "${esc(e.note)}"`:""}</div></div>`).join(""):` <div class="empty-msg">No activity yet — select a skill to start.</div>`;
  document.getElementById("dash-stats").innerHTML=`<div class="sc"><div class="sn" style="color:var(--gold)">${mc}</div><div class="sl">Mastered</div></div><div class="sc"><div class="sn" style="color:var(--cat2)">${st}</div><div class="sl">Active</div></div><div class="sc"><div class="sn" style="color:var(--muted)">${state.skills.reduce((s,sk)=>s+totalAtt(sk),0)}</div><div class="sl">Sessions</div></div><div class="sc"><div class="sn" style="color:var(--cat3)">${state.skills.filter(hasContent).length}</div><div class="sl">Ready</div></div>`;
}

function openLearn(i){learnIdx=i;learnTab="lessons";qAnswers={};qSubmitted=false;showView("learn");renderLearnHeader();renderLearnBody();}
function renderLearnHeader(){const s=state.skills[learnIdx],c=catOf(s);document.getElementById("learn-title").textContent=s.name;document.getElementById("learn-cat").textContent=c.name;document.getElementById("learn-cat").style.color=c.color;document.querySelectorAll(".learn-tab").forEach(t=>t.classList.toggle("active",t.dataset.tab===learnTab));}
function renderLearnBody(){const s=state.skills[learnIdx],c=catOf(s),b=document.getElementById("learn-body");if(learnTab==="lessons"){b.innerHTML=!s.content.lessons.length?`<div class="content-block"><div class="content-empty">No lessons yet. Add them in Teacher mode.</div></div>`:s.content.lessons.map(l=>`<div class="content-block"><div class="content-block-title">${esc(l.title)}</div><div class="content-body">${esc(l.body)}</div></div>`).join("");}else if(learnTab==="exercises"){b.innerHTML=!s.content.exercises.length?`<div class="content-block"><div class="content-empty">No exercises yet.</div></div>`:s.content.exercises.map(e=>`<div class="content-block"><div class="content-block-title">${esc(e.title)}</div><div class="content-body">${esc(e.body)}</div></div>`).join("");}else if(learnTab==="quiz"){renderQuizTab(s,c,b);}else{renderProgressTab(s,c,b);}}

function renderQuizTab(s,c,b){
  if(!s.content.quiz.length){b.innerHTML=`<div class="content-block"><div class="content-empty">No quiz questions yet.</div></div>`;return;}
  let h="";
  if(qSubmitted){let score=0,auto=0;s.content.quiz.forEach(q=>{if(q.type!=="open"){auto++;if(qAnswers[q.id]===q.correct)score++;}});const op=s.content.quiz.filter(q=>q.type==="open").length;const ps=auto>0?Math.round(score/auto*100):null;const col=ps==null?"var(--gold)":ps>=70?"#1fc87a":ps>=50?"var(--gold)":"#c44";h+=`<div class="quiz-score-bar"><div class="quiz-score-big" style="color:${col}">${ps!=null?ps+"%":"✓"}</div><div class="quiz-score-lbl">${ps!=null?`${score}/${auto} correct`:""}${op?` · ${op} open — self assess`:""}</div><div style="display:flex;gap:8px;justify-content:center;margin-top:14px;"><button class="btn btn-gold" onclick="logQuizSession(${state.skills.indexOf(s)},${score},${auto+op})">Log as Session</button><button class="btn btn-ghost" onclick="qAnswers={};qSubmitted=false;renderLearnBody()">Retry</button></div></div>`;}
  s.content.quiz.forEach((q,qi)=>{const ans=qAnswers[q.id];h+=`<div class="quiz-q"><div class="quiz-q-num">Question ${qi+1} — ${q.type==="mc"?"Multiple Choice":q.type==="tf"?"True / False":"Open"}</div><div class="quiz-q-text">${esc(q.question)}</div>`;if(q.type==="mc"||q.type==="tf"){const opts=q.type==="tf"?["True","False"]:(q.options||[]);h+=`<div class="quiz-options">`;opts.forEach(opt=>{let cls="quiz-option";if(qSubmitted){if(opt===q.correct)cls+=" correct";else if(opt===ans&&ans!==q.correct)cls+=" wrong";}else if(opt===ans)cls+=" selected";h+=`<button class="${cls}" ${qSubmitted?"disabled":""} onclick="selAns('${q.id}','${ea(opt)}')">${esc(opt)}</button>`;});h+=`</div>`;}else{h+=`<textarea class="quiz-open-input" placeholder="Write your answer…" id="oa-${q.id}" oninput="qAnswers['${q.id}']=this.value">${esc(ans||"")}</textarea>`;if(qSubmitted)h+=`<div class="quiz-feedback correct">Self-assess: did you answer correctly?</div>`;}h+=`</div>`;});
  if(!qSubmitted)h+=`<button class="btn btn-gold btn-full" style="margin-top:8px" onclick="submitQuiz()">Submit Answers</button>`;
  b.innerHTML=h;
}
function selAns(qId,opt){qAnswers[qId]=opt;renderLearnBody();}
function submitQuiz(){qSubmitted=true;renderLearnBody();}
function logQuizSession(idx,score,total){logAttempt(idx,`Quiz: ${score}/${total}`,score,total);qAnswers={};qSubmitted=false;learnTab="progress";renderLearnBody();renderLearnHeader();}

function renderProgressTab(s,c,b){
  const p=pct(s),ph=currentPhase(s),m=mastered(s);
  const unlocked={V:s.x>=10,IV:s.vPieces>=5,III:s.ivPieces>=4,II:s.iiiPieces>=3,I:s.iiPieces>=2};
  const phMap={v:"V",iv:"IV",iii:"III",ii:"II",i:"I"};
  let h=`<div class="progress-bar"><div class="progress-bar-fill" style="width:${p}%;background:${c.color}"></div></div><div class="progress-meta"><span>${currentLevel(s)} · ${p}% complete</span><span>${totalAtt(s)}/${MAX_ATT} sessions</span></div>`;
  if(m)h+=`<div class="mastered-banner" style="margin-top:12px">✦ MASTERED ✦</div>`;
  h+=`<div class="pyr-wrap" style="margin-top:12px"><div class="pyr-title">Skill Pyramid</div>`;
  const levels=[{k:"I",p:s.iPieces,m:1,a:s.iAtt},{k:"II",p:s.iiPieces,m:2,a:s.iiAtt},{k:"III",p:s.iiiPieces,m:3,a:s.iiiAtt},{k:"IV",p:s.ivPieces,m:4,a:s.ivAtt},{k:"V",p:s.vPieces,m:5,a:s.vAtt}];
  const descs={I:"Mastery — mentor others",II:"High proficiency — can teach",III:"Advanced — handles complexity",IV:"Developing — applies in new contexts",V:"Basic — can explain and follow"};
  levels.forEach(lv=>{const isAct=phMap[ph]===lv.k;h+=`<div class="pyr-row"><div class="pyr-key">${lv.k}</div><div class="pyr-blocks">`;for(let b2=0;b2<lv.m;b2++){const f=b2<lv.p,lk=!unlocked[lv.k];h+=`<div class="pyr-block${f?" filled":""} ${lk&&!f?"locked":""}" style="${f?`background:${c.color};`:""}"></div>`;}h+=`</div><div class="pyr-desc" style="${isAct?`color:${c.color}`:""}"> ${isAct?`${lv.a}/10 → next piece`:descs[lv.k]}</div></div>`;});
  h+=`<div class="pyr-row" style="padding-top:8px;border-top:1px solid var(--border);margin-top:2px"><div class="pyr-key">X</div><div class="x-track">`;
  for(let i=0;i<10;i++)h+=`<div class="x-pip" style="${i<s.x?`background:${c.color};`:""}"></div>`;
  h+=`</div><div class="pyr-desc">${s.x>=10?"Foundation complete":`${s.x}/10 initial sessions`}</div></div></div>`;
  if(!m){h+=`<div style="margin-top:14px"><div class="section-label" style="margin-bottom:8px">Log Practice Session</div><textarea class="log-note-area" id="log-note" placeholder="Optional note…"></textarea><button class="btn btn-gold btn-full" onclick="doLog(${state.skills.indexOf(s)})">+ Log Session</button></div>`;}
  if(s.log.length){h+=`<div style="margin-top:16px"><div class="section-label" style="margin-bottom:8px">Activity Log</div>`;s.log.slice(0,10).forEach(e=>{const d=new Date(e.ts);h+=`<div class="log-entry"><div class="log-entry-header"><span class="log-entry-level" style="color:${c.color}">${e.level}</span><span class="log-entry-date">${d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})} ${d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}</span></div>${e.quizScore!=null?`<div style="font-size:9px;color:var(--gold)">Quiz: ${e.quizScore}/${e.quizTotal}</div>`:""}${e.note?`<div class="log-entry-note">"${esc(e.note)}"</div>`:""}</div>`;});if(s.log.length>10)h+=`<div style="font-size:9px;color:var(--muted);padding-left:10px">+${s.log.length-10} more</div>`;h+=`</div>`;}
  b.innerHTML=h;
}
function doLog(idx){const note=document.getElementById("log-note")?.value?.trim()||"";logAttempt(idx,note);renderLearnBody();}

function renderGrid(){let h="";for(let i=0;i<MAX_SKILLS;i++){if(i<state.skills.length){const s=state.skills[i],c=catOf(s),p=pct(s),m=mastered(s),nc=!hasContent(s);const op=nc?0:(m?.6:p>0?.12+p/100*.28:0);h+=`<div class="grid-cell${nc?" nc":""}" data-tip="${i+1}. ${s.name}" ${nc?"":`onclick="openLearn(${i})"`}><div class="gc-fill" style="background:${c.color};opacity:${op}"></div><div class="gc-num">${i+1}</div><div class="gc-level" style="color:${p>0||m?c.color:"var(--dim)"}">${m?"✓":p>0?currentLevel(s):""}</div><div class="gc-name" style="color:${p>0?c.color:"var(--muted)"}">${esc(s.name)}</div></div>`;}else{h+=`<div class="grid-cell nc"><div class="gc-num">${i+1}</div><div class="gc-name" style="color:var(--dim)">—</div></div>`;}}document.getElementById("main-grid").innerHTML=h;}

function renderStats(){const sk=state.skills,mc=sk.filter(mastered).length,st=sk.filter(s=>totalAtt(s)>0&&!mastered(s)).length,sess=sk.reduce((s,sk2)=>s+totalAtt(sk2),0);document.getElementById("stats-row").innerHTML=`<div class="sc"><div class="sn" style="color:var(--gold)">${mc}</div><div class="sl">Mastered</div></div><div class="sc"><div class="sn" style="color:var(--cat2)">${st}</div><div class="sl">In Progress</div></div><div class="sc"><div class="sn" style="color:var(--muted)">${sk.length-mc-st}</div><div class="sl">Not Started</div></div><div class="sc"><div class="sn" style="color:var(--cat3)">${sess}</div><div class="sl">Sessions</div></div>`;const cm={};sk.forEach(s=>{if(!cm[s.catId])cm[s.catId]=[];cm[s.catId].push(s);});document.getElementById("cat-row").innerHTML=Object.entries(cm).map(([cid,cs])=>{const c=CATS[(cid||1)-1]||CATS[4],m2=cs.filter(mastered).length,s2=cs.filter(s=>totalAtt(s)>0&&!mastered(s)).length,avg=Math.round(cs.reduce((s,sk2)=>s+pct(sk2),0)/cs.length);return`<div class="cat-card"><div class="cat-name" style="color:${c.color}">${c.name}</div><div class="cat-bar-t"><div class="cat-bar-f" style="width:${avg}%;background:${c.color}"></div></div><div style="font-size:9px;color:var(--muted)">${m2} mastered · ${s2} active · ${avg}% avg</div></div>`;}).join("");document.getElementById("all-skills-list").innerHTML=sk.map((s,i)=>{const c=catOf(s),p=pct(s);return`<div style="display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="openLearn(${i})"><div style="width:24px;font-size:9px;color:var(--muted);text-align:right">${i+1}</div><div style="flex:1;font-size:11px;font-weight:700">${esc(s.name)}</div><div style="width:80px;height:2px;background:var(--border)"><div style="width:${p}%;height:100%;background:${c.color}"></div></div><div style="width:30px;text-align:right;font-size:9px;font-weight:700;color:${p>0?c.color:"var(--muted)"}">${currentLevel(s)}</div><div style="width:30px;text-align:right;font-size:9px;color:var(--muted)">${p}%</div></div>`;}).join("");}

function renderTEditor(){const i=editIdx;if(i===null||i>=state.skills.length)return;const s=state.skills[i];document.getElementById("t-main").innerHTML=`<div class="ed-sec"><div class="ed-title"><span>Skill ${i+1}</span><div style="display:flex;gap:6px"><button class="btn btn-sm ${s.locked?"btn-gold":""}" onclick="toggleLock(${i})">${s.locked?"🔒 Locked":"🔓 Lock"}</button><button class="btn btn-sm btn-danger" onclick="delSkill(${i})">Delete</button></div></div><label class="lbl">Name</label><input class="t-input" value="${esc(s.name)}" oninput="upSkill(${i},'name',this.value)"><label class="lbl">Description</label><textarea class="t-ta" style="min-height:54px" oninput="upSkill(${i},'description',this.value)" placeholder="What this skill is about…">${esc(s.description)}</textarea><label class="lbl">Category</label><select class="t-input" style="width:auto" onchange="upSkill(${i},'catId',parseInt(this.value))">${CATS.map(c=>`<option value="${c.id}" ${s.catId===c.id?"selected":""}>${c.name}</option>`).join("")}</select></div><div class="ed-sec"><div class="ed-title"><span>Lessons (${s.content.lessons.length})</span><button class="btn btn-sm" onclick="addLesson(${i})">+ Add</button></div>${s.content.lessons.map((l,li)=>`<div style="background:var(--surface2);border:1px solid var(--border);padding:12px;margin-bottom:10px"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="font-size:9px;color:#ffaa22">Lesson ${li+1}</span><button class="btn btn-sm btn-danger" onclick="rmLesson(${i},${li})">Remove</button></div><input class="t-input" value="${esc(l.title)}" oninput="upLesson(${i},${li},'title',this.value)" placeholder="Title"><textarea class="t-ta" oninput="upLesson(${i},${li},'body',this.value)" placeholder="Content…">${esc(l.body)}</textarea></div>`).join("")}</div><div class="ed-sec"><div class="ed-title"><span>Exercises (${s.content.exercises.length})</span><button class="btn btn-sm" onclick="addEx(${i})">+ Add</button></div>${s.content.exercises.map((e,ei)=>`<div style="background:var(--surface2);border:1px solid var(--border);padding:12px;margin-bottom:10px"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="font-size:9px;color:#ffaa22">Exercise ${ei+1}</span><button class="btn btn-sm btn-danger" onclick="rmEx(${i},${ei})">Remove</button></div><input class="t-input" value="${esc(e.title)}" oninput="upEx(${i},${ei},'title',this.value)" placeholder="Title"><textarea class="t-ta" oninput="upEx(${i},${ei},'body',this.value)" placeholder="Instructions…">${esc(e.body)}</textarea></div>`).join("")}</div><div class="ed-sec"><div class="ed-title"><span>Quiz (${s.content.quiz.length})</span><div style="display:flex;gap:5px"><button class="btn btn-sm" onclick="addQ(${i},'mc')">+MC</button><button class="btn btn-sm" onclick="addQ(${i},'tf')">+T/F</button><button class="btn btn-sm" onclick="addQ(${i},'open')">+Open</button></div></div>${s.content.quiz.map((q,qi)=>renderQEditor(i,qi,q)).join("")}</div>`;}
function renderQEditor(si,qi,q){const tl=q.type==="mc"?"Multiple Choice":q.type==="tf"?"True / False":"Open";let oh="";if(q.type==="mc"){oh=`<div style="margin-top:8px"><label class="lbl">Options</label>`;(q.options||["","","",""]).forEach((o,oi)=>{oh+=`<div style="display:flex;gap:6px;align-items:center;margin-bottom:5px"><span style="font-size:9px;color:var(--muted);width:16px">${String.fromCharCode(65+oi)}.</span><input class="t-input" style="flex:1;margin-bottom:0" value="${esc(o)}" oninput="upQOpt(${si},${qi},${oi},this.value)" placeholder="Option ${String.fromCharCode(65+oi)}"></div>`;});oh+=`</div><div style="margin-top:8px"><label class="lbl">Correct Answer</label><select class="t-input" style="width:auto" onchange="upQF(${si},${qi},'correct',this.value)">${(q.options||["","","",""]).map((o,oi)=>`<option value="${esc(o)}" ${q.correct===o?"selected":""}>${String.fromCharCode(65+oi)}. ${o||"(empty)"}</option>`).join("")}</select></div>`;}else if(q.type==="tf"){oh=`<div style="margin-top:8px"><label class="lbl">Correct Answer</label><select class="t-input" style="width:auto" onchange="upQF(${si},${qi},'correct',this.value)"><option value="True" ${q.correct==="True"?"selected":""}>True</option><option value="False" ${q.correct==="False"?"selected":""}>False</option></select></div>`;}else{oh=`<div style="margin-top:4px;font-size:9px;color:var(--muted)">Open — self-assessed by learner.</div>`;}return`<div class="qei"><div class="qei-hdr"><span class="qei-num">Q${qi+1} · ${tl}</span><button class="btn btn-sm btn-danger" onclick="rmQ(${si},${qi})">Remove</button></div><textarea class="t-ta" style="min-height:54px" oninput="upQF(${si},${qi},'question',this.value)" placeholder="Question…">${esc(q.question)}</textarea>${oh}</div>`;}
function toggleLock(i){state.skills[i].locked=!state.skills[i].locked;save();renderTList();renderTEditor();}
function delSkill(i){if(!confirm(`Delete "${state.skills[i].name}"?`))return;state.skills.splice(i,1);state.skills.forEach((s,j)=>s.id=j+1);editIdx=null;save();renderTList();document.getElementById("t-main").innerHTML=`<div style="color:var(--muted);font-size:11px;padding:40px;text-align:center">Select a skill</div>`;}
function upSkill(i,f,v){state.skills[i][f]=f==="catId"?parseInt(v):v;save();if(f==="name")renderTList();}
function addLesson(i){state.skills[i].content.lessons.push({id:uid(),title:"New Lesson",body:""});save();renderTEditor();}
function rmLesson(i,li){state.skills[i].content.lessons.splice(li,1);save();renderTEditor();}
function upLesson(i,li,f,v){state.skills[i].content.lessons[li][f]=v;save();}
function addEx(i){state.skills[i].content.exercises.push({id:uid(),title:"New Exercise",body:""});save();renderTEditor();}
function rmEx(i,ei){state.skills[i].content.exercises.splice(ei,1);save();renderTEditor();}
function upEx(i,ei,f,v){state.skills[i].content.exercises[ei][f]=v;save();}
function addQ(i,t){const q={id:uid(),question:"",type:t,options:t==="mc"?["","","",""]:[], correct:t==="tf"?"True":"",points:1};state.skills[i].content.quiz.push(q);save();renderTEditor();}
function rmQ(i,qi){state.skills[i].content.quiz.splice(qi,1);save();renderTEditor();}
function upQF(i,qi,f,v){state.skills[i].content.quiz[qi][f]=v;save();}
function upQOpt(i,qi,oi,v){if(!state.skills[i].content.quiz[qi].options)state.skills[i].content.quiz[qi].options=["","","",""];state.skills[i].content.quiz[qi].options[oi]=v;save();}

function showPin(title,hint,cb){document.getElementById("pin-title").textContent=title;document.getElementById("pin-hint").textContent=hint;document.getElementById("pin-input").value="";document.getElementById("pin-err").textContent="";document.getElementById("pin-overlay").style.display="flex";pinCb=cb;setTimeout(()=>document.getElementById("pin-input").focus(),80);}
function checkPin(){const v=document.getElementById("pin-input").value;if(state.teacherPin&&v!==state.teacherPin){document.getElementById("pin-err").textContent="Incorrect PIN";document.getElementById("pin-input").value="";return;}document.getElementById("pin-overlay").style.display="none";if(pinCb){pinCb();pinCb=null;}}
function enterTeacher(){if(state.teacherPin){showPin("Teacher Mode","Enter PIN",()=>{isTeacher=true;showView("teacher");updateBadge();renderTeacher();});}else{isTeacher=true;showView("teacher");updateBadge();renderTeacher();}}
function exitTeacher(){isTeacher=false;updateBadge();showView("dash");renderDash();}
function setPin(){showPin("Set PIN","New PIN (leave blank = no PIN required)",()=>{const v=document.getElementById("pin-input").value;state.teacherPin=v||null;save();alert(v?"PIN set.":"PIN removed.");});}
function updateBadge(){const b=document.getElementById("mode-badge");b.textContent=isTeacher?"Teacher":"Learner";b.className="mode-badge "+(isTeacher?"teacher":"learner");}

function showView(n){document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));document.getElementById("view-"+n).classList.add("active");document.querySelectorAll(".nav-btn[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===n));if(n==="dash")renderDash();else if(n==="grid")renderGrid();else if(n==="stats")renderStats();else if(n==="teacher")renderTeacher();}
function renderAll(){renderDash();updateBadge();}

document.querySelectorAll(".nav-btn[data-view]").forEach(b=>b.addEventListener("click",()=>{if(b.id==="nav-teacher"){if(!isTeacher){enterTeacher();return;}}showView(b.dataset.view);}));
document.querySelectorAll(".learn-tab").forEach(t=>t.addEventListener("click",()=>{learnTab=t.dataset.tab;qAnswers={};qSubmitted=false;renderLearnHeader();renderLearnBody();}));
document.getElementById("learn-back").addEventListener("click",()=>showView("dash"));
document.getElementById("btn-export").addEventListener("click",exportData);
document.getElementById("hdr-import").addEventListener("change",e=>importData(e.target.files[0]));
document.getElementById("btn-add-skill").addEventListener("click",()=>{if(state.skills.length>=MAX_SKILLS){alert("Maximum 25 skills reached.");return;}state.skills.push(blankSkill(state.skills.length+1));editIdx=state.skills.length-1;save();renderTList();renderTEditor();});
document.getElementById("btn-set-pin").addEventListener("click",setPin);
document.getElementById("btn-exit-teacher").addEventListener("click",exitTeacher);
document.getElementById("pin-submit").addEventListener("click",checkPin);
document.getElementById("pin-cancel").addEventListener("click",()=>{document.getElementById("pin-overlay").style.display="none";pinCb=null;});
document.getElementById("pin-input").addEventListener("keydown",e=>{if(e.key==="Enter")checkPin();if(e.key==="Escape"){document.getElementById("pin-overlay").style.display="none";pinCb=null;}});
document.getElementById("dp-name").addEventListener("click",()=>{document.getElementById("dp-name").style.display="none";const i=document.getElementById("dp-input");i.style.display="inline-block";i.value=state.profileName;i.focus();i.select();});
document.getElementById("dp-input").addEventListener("blur",()=>{const v=document.getElementById("dp-input").value.trim();if(v)state.profileName=v;document.getElementById("dp-name").textContent=state.profileName;document.getElementById("dp-name").style.display="";document.getElementById("dp-input").style.display="none";save();});
document.getElementById("dp-input").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("dp-input").blur();if(e.key==="Escape"){document.getElementById("dp-input").value=state.profileName;document.getElementById("dp-input").blur();}});

load();renderAll();
</script>
</body>
</html>
